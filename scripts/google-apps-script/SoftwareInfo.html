em nhỏ có hoàn cảnh khó khăn thông qua các chương trình chính thống **MÁI ẤM GIA ĐÌNH VIỆT (HTV)** hoặc **CẶP LÁ YÊU THƯƠNG (VTV)**. Anh chị có thể hỗ trợ các em bằng cách chuyển khoản tới chương trình hoặc từng hoàn cảnh cụ thể. Sau khi chuyển khoản, vui lòng chụp màn hình và gửi lại cho mình; mình sẽ cài đặt để anh chị em bắt đầu sử dụng.\r\n\r\nBởi đôi khi, làm việc tốt không nhất thiết phải bắt đầu từ những điều lớn lao. Chỉ cần chúng ta có lòng, có sự sẻ chia và sẵn sàng cho đi trong khả năng của mình, thì mỗi hành động nhỏ đều có thể gieo nên một hạt mầm thiện lành.\r\n\r\n**Chúc các anh chị em có nhiều khách hàng.**\r\n\r\n**Vợ chồng Lão bán chè: CHÈ MSHOA — CHÈ ÍT NGỌT**\r\n";</script>
