html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden !important;
  -webkit-overflow-scrolling: touch;
}
body {
  background-color: #faf5ff;
  color: #1e1b4b;
  font-family: var(--font-sans), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
  padding-bottom: env(safe-area-inset-bottom, 20px);

}
.glass {
  background: #ffffff;
  border: 1px solid #e9d5ff;
  border-radius: 1rem;
  box-shadow: 0 2px 8px rgba(107, 33, 168, 0.05);
}
.glass-card {
  background: #ffffff;
  border: 1px solid #e9d5ff;
  border-radius: 1rem;
  box-shadow: 0 2px 8px rgba(107, 33, 168, 0.05);
}
.glass-glow {
  background: #ffffff;
  border: 2px solid #7e22ce;
  box-shadow: 0 4px 16px rgba(126, 34, 206, 0.15);
}
.glass-hover:hover {
  border-color: #c084fc;
  box-shadow: 0 4px 14px rgba(107, 33, 168, 0.1);
}
.sticky-col-stt {
  position: sticky;
  left: 0;
  z-index: 20;
}
.sticky-col-name {
  position: sticky;
  left: 36px;
  z-index: 20;
}
.sticky-col-shadow::after {
  content: '';
  position: absolute;
  top: 0;
  right: -6px;
  bottom: 0;
  width: 6px;
  background: linear-gradient(to right, rgba(107, 33, 168, 0.08), transparent);
  pointer-events: none;
}
.text-gradient {
  background: linear-gradient(135deg, #d97706 0%, #ea580c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.text-gradient-cool {
  background: linear-gradient(135deg, #0284c7 0%, #6d28d9 50%, #be185d 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.text-gradient-emerald {
  background: linear-gradient(135deg, #059669 0%, #047857 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.btn-gradient {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(217, 119, 6, 0.25);
  transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-gradient:active {
  transform: scale(0.96) translateY(1px);
  box-shadow: 0 1px 4px rgba(217, 119, 6, 0.2);
}
.btn-gradient-success {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(5, 150, 105, 0.25);
  transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-gradient-success:active {
  transform: scale(0.96) translateY(1px);
}
.btn-gradient-danger {
  background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(225, 29, 72, 0.25);
  transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-gradient-danger:active {
  transform: scale(0.96) translateY(1px);
}
.btn-shine {
  position: relative;
  overflow: hidden;
}
.btn-shine::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.5s;
}
.btn-shine:hover::before {
  left: 100%;
}
.calendar-day {
  transition: all 150ms;
}
.calendar-day:hover {

}

  background: #fef3c7;

@keyframes bounceIn {
  0% {
    transform: scale(0);
    opacity: 0;
  }
  50% {
    transform: scale(1.15);
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
@keyframes fadeInUp {
  from {
    transform: translateY(15px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes slideInRight {
  from {
    transform: translateX(100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}
@keyframes slideOutRight {
  from {
    transform: translateX(0);
    opacity: 1;
  }
  to {
    transform: translateX(100%);
    opacity: 0;
  }
}
.animate-bounce-in {
  animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.animate-fade-in-up {
  animation: fadeInUp 0.4s ease both;
}
.animate-fade-in-up-delay-1 {
  animation: fadeInUp 0.4s ease 0.1s both;
}
.animate-fade-in-up-delay-2 {
  animation: fadeInUp 0.4s ease 0.2s both;
}
.animate-fade-in {
  animation: fadeIn 0.3s ease both;
}
.animate-slide-in-right {
  animation: slideInRight 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.animate-slide-out-right {
  animation: slideOutRight 0.2s ease forwards;
}
